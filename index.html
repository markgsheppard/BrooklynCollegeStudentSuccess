<p style="margin: 0 0 32px; max-width: 760px; color: #4A433D">Graduate programs in economics weigh your quantitative preparation and research experience heavily. Start planning early, ideally by sophomore or junior year.</p>

<div style="flex: 1 1 560px">
<h3 style="margin: 0 0 6px; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; line-height: 1.15">M.S. in Business Administration: Economic Analysis</h3>
<p style="margin: 0; font-size: 16px; color: #4A433D">Brooklyn College's master's in economics is offered as Option 1 of the M.S. in Business Administration and taught by the Department of Economics. It's 33 credits of graduate microeconomics, macroeconomics, econometrics and applied fields, in person on the Brooklyn campus.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex: 0 1 380px">
<div style="background: #F7F3EE; padding: 14px; text-align: center"><span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 700; color: #882345">33</span><span style="font-size: 13px; font-weight: 700">credits</span></div>
<div style="background: #F7F3EE; padding: 14px; text-align: center"><span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 700; color: #882345">5</span><span style="font-size: 13px; font-weight: 700">core courses</span></div>
<div style="background: #F7F3EE; padding: 14px; text-align: center"><span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 700; color: #882345">6</span><span style="font-size: 13px; font-weight: 700">electives</span></div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px">
<h4 style="margin: 0; font-size: 19px">Step 1 · Get admitted</h4>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
<li>A bachelor's degree, with undergraduate coursework in <strong>macroeconomics, microeconomics, statistics and calculus</strong></li>
<li>Transcripts from every college attended (international degrees need a course-by-course evaluation)</li>
<li>Two letters of recommendation</li>
<li>F-1/J-1 applicants: TOEFL 79, IELTS 6.5, PTE 58+ or Duolingo 105+</li>
</ul>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 14px">
<div style="border: 1px solid #E4DCD2; padding: 12px"><strong style="display: block">Fall start</strong>Apply by Aug 1<br>I-20 deadline Jul 15</div>
<div style="border: 1px solid #E4DCD2; padding: 12px"><strong style="display: block">Spring start</strong>Apply by Dec 15 (rolling after)<br>I-20 deadline Dec 5</div>
</div>
</div>

<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px">
<h4 style="margin: 0; font-size: 19px">Step 2 · Complete the core (15 credits)</h4>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F7F3EE"><strong style="flex: none; width: 82px; color: #882345">ECON 7000X</strong>Microeconomics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F7F3EE"><strong style="flex: none; width: 82px; color: #882345">ECON 7010X</strong>Macroeconomics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F7F3EE"><strong style="flex: none; width: 82px; color: #882345">ECON 7020X</strong>Econometrics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F7F3EE"><strong style="flex: none; width: 82px; color: #882345">ECON 7021X</strong>Advanced Econometrics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F7F3EE"><strong style="flex: none; width: 82px; color: #882345">ECON 7025X</strong>Mathematical Methods in Economics I</li>
</ol>
<p style="margin: 0; font-size: 14px; color: #4A433D">Waivers (with the chair's or graduate deputy chair's permission): Math 2101 or equivalent can replace 7025X, and Math 2501 or 3501 can replace 7020X, each with a substitute course.</p>
</div>

<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px">
<h4 style="margin: 0; font-size: 19px">Step 3 · Choose six electives (18 credits)</h4>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7027X International Trade</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7028X International Economics &amp; Finance</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7030X Public Finance &amp; Public Policy</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7060X Health Economics</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7215X Money &amp; Capital Markets</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">Finance 7216X</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7230X Operations Research &amp; Decision Sciences</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7309X Environmental Risk Management</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7090X Special Topics</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7091G Independent Reading</li>
<li style="padding: 6px 10px; border: 1px solid #D9CFC4">7095G Thesis Research</li>
</ul>
<p style="margin: 0; font-size: 14px; color: #4A433D">Up to six credits of other graduate courses may count with permission. Students who took Finance 7215X can't also take Economics 7215X. Planning a Ph.D.? Use 7091G and 7095G to write a thesis-length research paper with a faculty advisor.</p>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 18px 20px; background: #F6ECEF">
<div style="font-size: 15px"><strong>Program contacts:</strong> Prof. Yehuda L. Klein, 217 Whitehead Hall, 718.951.5153 · Prof. Nadia Doytch, graduate deputy for the Economic Analysis option · Graduate Admissions, 222 West Quad Center, 718.951.4536</div>
<a href="https://www.brooklyn.edu/academics/programs/business-administration-ms/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; background: #882345; color: #FFFFFF; font-weight: 700; text-decoration: none">Program page &amp; application ↗</a>

<p style="margin: 0; font-size: 16px; color: #4A433D">CUNY's doctoral program in economics is based at the Graduate Center (365 Fifth Avenue, Manhattan). Brooklyn College faculty, including Professors Doytch and Uctum, teach and advise in it. It's a full-time research degree that trains economists for academia, government and policy research.</p>

<div style="background: #F7F3EE; padding: 14px; text-align: center"><span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 700; color: #882345">2</span><span style="font-size: 13px; font-weight: 700">exams</span></div>

];

renderVals() {
const f = this.state.fund;
return {
faculty: FACULTY,
showMS: this.state.grad === "ms",
showPhD: this.state.grad === "phd",
pickMS: () => this.setState({ grad: "ms" }),
pickPhD: () => this.setState({ grad: "phd" }),
featured: FEATURED,
fundTabs: TABS.map(t => ({ label: t[1], active: f === t[0], inactive: f !== t[0], pick: () => this.setState({ fund: t[0] }) })),
fundRows: FUND.filter(r => f === "all" || r.tags.indexOf(f) > -1),
sent: this.state.sent,
notSent: !this.state.sent,
sendForm: () => this.setState({ sent: true })
};
}
}
DCLite.mount(Component);
